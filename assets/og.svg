<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Humbie Hunter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.55" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b00"/>
      <stop offset="1" stop-color="#ff0000"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- target mark -->
  <g transform="translate(160 315)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#ring)" stroke-width="16" opacity="0.95"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.9"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00ff00" stroke-width="10" opacity="0.85"/>
    <path d="M0 -190v60M0 130v60M-190 0h60M130 0h60" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  </g>

  <text x="360" y="290" fill="#ffffff" font-family="Orbitron, Arial, sans-serif" font-size="70" font-weight="900">Humbie Hunter</text>
  <text x="360" y="360" fill="#00d4ff" font-family="Orbitron, Arial, sans-serif" font-size="38" font-weight="700">Fast aim • Level up • Upgrade weapons</text>
  <text x="360" y="425" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="28">Play directly in your browser (H5). No downloads. Works offline once cached.</text>
</svg>
