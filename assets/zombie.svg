<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Zombie target">
  <defs>
    <radialGradient id="skin" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#a7ff7a"/>
      <stop offset="1" stop-color="#2f6b2f"/>
    </radialGradient>
  </defs>

  <!-- head -->
  <circle cx="64" cy="64" r="52" fill="url(#skin)" stroke="#0a0a0a" stroke-width="6"/>

  <!-- eyes -->
  <ellipse cx="46" cy="54" rx="12" ry="10" fill="#ffffff"/>
  <ellipse cx="82" cy="54" rx="12" ry="10" fill="#ffffff"/>
  <circle cx="46" cy="54" r="4" fill="#0a0a0a"/>
  <circle cx="82" cy="54" r="4" fill="#0a0a0a"/>

  <!-- mouth -->
  <path d="M40 82c8 10 40 10 48 0" fill="none" stroke="#0a0a0a" stroke-width="6" stroke-linecap="round"/>

  <!-- scar -->
  <path d="M90 24l10 10" stroke="#ff0000" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
</svg>
